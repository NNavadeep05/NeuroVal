name: NeuroVal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  unit-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NeuroVal
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run ExperimentalData tests
        run: python -m pytest tests/test_experimental.py -v

      - name: Run FeatureComparator tests
        run: python -m pytest tests/test_comparison.py -v

      - name: Run ValidationPipeline tests
        run: python -m pytest tests/test_validation.py -v