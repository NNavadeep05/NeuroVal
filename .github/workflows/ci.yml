name: NeuroVal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  unit-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NeuroVal
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # Integration tests skip themselves unless NEUROVAL_MODEL_PATH is set.
      - name: Run unit tests
        run: python -m pytest tests -v